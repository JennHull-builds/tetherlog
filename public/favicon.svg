<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TetherLog">
  <!-- A pixel letter T on an 8 by 8 grid, each cell 4 units, so it lands on whole
       pixels at 16 and 32. Light ground and accent blue, the kit's light theme.
       Rectangles only, no font, so it draws the same everywhere. -->
  <rect width="32" height="32" rx="6" fill="#f3f2ee"/>
  <g fill="#396bf2" shape-rendering="crispEdges">
    <rect x="4" y="4" width="24" height="8"/>
    <rect x="12" y="12" width="8" height="16"/>
  </g>
</svg>
