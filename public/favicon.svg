<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="TetherLog">
  <!-- Ground, kept in step with the app and the manifest theme_color. -->
  <rect width="32" height="32" rx="9" fill="#08090c"/>
  <!-- Space bending around the mass: two rules that bow toward the centre
       rather than running straight past it. Depth is what an object does to
       its surroundings. See docs/LOOK.md. -->
  <path d="M4 10.5C9 10.5 12 13 16 13s7-2.5 12-2.5" stroke="#586271" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4 21.5C9 21.5 12 19 16 19s7 2.5 12 2.5" stroke="#586271" stroke-width="1.5" stroke-linecap="round"/>
  <!-- The mass itself, with its luminous rim. -->
  <circle cx="16" cy="16" r="3.4" fill="#8f7dff"/>
  <circle cx="16" cy="16" r="5.2" stroke="#a99bff" stroke-width="1.2" opacity="0.55"/>
</svg>
