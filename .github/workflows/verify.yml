name: verify

# Why this exists: on 2026-09-18 the verification scripts were wedged into
# `npm run build` and every Vercel deployment failed, with no local repro and
# no readable build logs. The scripts came back off the deploy path and landed
# here instead, where the logs can actually be read.
# Background: docs/DECISIONS.md D-008.
#
# `npm run build` must stay `tsc -b && vite build`. Never add a shell script to it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocking. These are the two checks that were breaking the deploy.
      - name: Privacy check
        run: npm run privacy:check

      - name: Token check
        run: npm run tokens:check

      # D-009's mechanical half: every path the docs name must still exist.
      # See docs/DECISIONS.md D-025.
      - name: Docs path check
        run: npm run docs:check

      - name: Build
        run: npm run build

      # Blocking since 2026-09-18, when the last 9 problems were cleared.
      - name: Lint
        run: npm run lint

      # The prose-leak guard from D-006 is silent when it breaks: the rules it
      # lets through are valid CSS, just not ours. So assert the directives are
      # still there, then assert on the built file.
      - name: Assert the @source guards are present
        run: |
          MISSING=0
          for SRC in '../*.md' '../docs/**/*.md' '../.cursorrules' '../.github/**' '../scripts/**'; do
            grep -qF "@source not \"$SRC\"" src/index.css || {
              echo "::error::Missing @source not \"$SRC\" in src/index.css"; MISSING=1; }
          done
          [ "$MISSING" = "0" ] || {
            echo "See docs/DECISIONS.md D-006. Removing these silently ships junk CSS."; exit 1; }
          echo "All five @source guards present."

      # The list below is every utility that has actually leaked here, not a
      # guess at which words read like prose. The previous list named five
      # that never leaked and missed all four that did, so it passed green
      # while .shadow shipped for weeks. See docs/DECISIONS.md D-024.
      #
      # `fixed` is deliberately absent: GravityField really does use it.
      # The match requires the brace immediately after the name, so `rounded`
      # does not fire on a legitimate `rounded-2xl`.
      - name: Assert no prose-leaked utilities in built CSS
        run: |
          CSS=$(find dist/assets -name '*.css' | head -1)
          echo "Checking $CSS"
          FOUND=0
          for RULE in 'inline' 'ring' 'rounded' 'shadow' 'blur' 'static' 'transform' \
                      'grow' 'invisible' 'font-sans' 'backdrop-filter' 'rounded-card'; do
            if grep -qE "(^|[},])\.${RULE}\{" "$CSS"; then
              echo "::error::Prose-leaked utility in production CSS: .$RULE"
              FOUND=1
            fi
          done
          # Arbitrary-value classes quoted in prose, which is how this started.
          if grep -qE "(^|[},])\.bg-\\\\\[var" "$CSS"; then
            echo "::error::Prose-leaked arbitrary-value utility in production CSS"
            FOUND=1
          fi
          if [ "$FOUND" = "1" ]; then
            echo "The @source not directives in src/index.css are not holding. See docs/DECISIONS.md D-006 and D-024."
            exit 1
          fi
          echo "No prose-leaked utilities found."
